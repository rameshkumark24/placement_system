server:
  # Render (and most PaaS hosts) inject PORT; fall back to 8080 locally.
  port: ${PORT:8080}
  # Honour X-Forwarded-Proto/Host from Render's proxy so generated URLs (e.g. Swagger's server URL) use https.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: placement-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    # Small pool by default: free MySQL plans allow very few connections.
    # Override with SPRING_DATASOURCE_HIKARI_* environment variables.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

jwt:
  secret: ${JWT_SECRET:placementSystemJwtSecretKey2026SecureKey123!}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
  refill-duration-minutes: ${RATE_LIMIT_REFILL_DURATION_MINUTES:1}
  # Stricter limit for /auth/** (login, register, refresh) to slow down password guessing.
  auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
  auth-refill-duration-minutes: ${RATE_LIMIT_AUTH_REFILL_DURATION_MINUTES:1}

app:
  cors:
    # Comma-separated. Exact origins or patterns such as https://*.vercel.app
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
  admin:
    # When both are set, an ADMIN account is created on startup if it does not exist yet.
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    name: ${APP_ADMIN_NAME:Placement Admin}
