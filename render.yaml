# Render Blueprint for the Spring Boot backend.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: placement-system-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    # Public, database-free liveness endpoint. Render waits for it before routing traffic to a new deploy.
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      # Small pool for free MySQL plans (Clever Cloud dev plan allows only 5 connections).
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "2"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "10000"
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "30000"
      # Render generates a random 256-bit secret the first time the Blueprint is applied.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "1800000"
      - key: RATE_LIMIT_CAPACITY
        value: "100"
      - key: RATE_LIMIT_REFILL_TOKENS
        value: "100"
      - key: RATE_LIMIT_REFILL_DURATION_MINUTES
        value: "1"
      - key: RATE_LIMIT_AUTH_CAPACITY
        value: "20"
      # e.g. https://your-app.vercel.app (no trailing slash). Wildcards like https://*.vercel.app work too.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # First admin account, created on startup if it does not exist yet.
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
